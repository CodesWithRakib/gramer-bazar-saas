    <rect x="10" y="10" width="250" height="250" rx="50" stroke="#ffffff" stroke-opacity="0.15" stroke-width="3"/>

    <!-- Basket / Basin -->
    <path d="M72 165 C72 165, 85 218, 135 218 C185 218, 198 165, 198 165 Z" fill="#ffffff" fill-opacity="0.95"/>
