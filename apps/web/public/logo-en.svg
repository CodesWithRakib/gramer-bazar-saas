    <path d="M134 115 C106 107, 88 78, 88 78 C88 78, 118 75, 134 100 Z" fill="#ffffff"/>
    <path d="M136 102 C164 94, 182 65, 182 65 C182 65, 152 62, 136 87 Z" fill="#f59e0b"/>
    <path d="M134 140 C112 134, 101 112, 101 112 C101 112, 123 109, 134 129 Z" fill="#fef08a"/>
    <path d="M136 132 C158 126, 169 104, 169 104 C169 104, 147 101, 136 121 Z" fill="#ffffff"/>
