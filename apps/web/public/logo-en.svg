<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 320" width="1100" height="320" fill="none">
  <defs>
    <!-- Terracotta Emblem Gradients -->
    <linearGradient id="emblemGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="45%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="goldGradEn" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="leafGradEn" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="shadowEn" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#7c2d12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Brand Emblem (Squircle + Terracotta Pot & Sprout Motif) -->
  <g transform="translate(30, 25)">
    <!-- Squircle Background with baked clay warmth -->
    <rect width="270" height="270" rx="60" fill="url(#emblemGradEn)" filter="url(#shadowEn)"/>
    <rect x="10" y="10" width="250" height="250" rx="50" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2.5"/>

    <!-- Subtle Golden Sun / Harvest Glow behind sprout -->
    <circle cx="135" cy="96" r="58" fill="#fef3c7" fill-opacity="0.18"/>

    <!-- Terracotta Clay Basket / Basin (মাটির পাত্র / সানকি) -->
    <path d="M72 165 C72 165, 85 218, 135 218 C185 218, 198 165, 198 165 Z" fill="#ffffff" fill-opacity="0.96"/>
    <ellipse cx="135" cy="165" rx="63" ry="14" fill="url(#goldGradEn)"/>
    
    <!-- Pottery Artisan Engravings (ঐতিহ্যবাহী পোড়ামাটির রেখা) -->
    <path d="M102 175 L121 213 M135 178 L135 218 M168 175 L149 213" stroke="#ea580c" stroke-width="3.5" stroke-linecap="round"/>
    <path d="M86 182 Q135 202 184 182" stroke="#ea580c" stroke-width="2" stroke-opacity="0.6" stroke-linecap="round" fill="none"/>

    <!-- Sprout Stem (White Pure Growth) -->
    <path d="M135 165 Q134 110 135 65" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>

    <!-- Sprout Leaves with Solar Warmth -->
    <!-- Top Crown Leaf (Golden Sun) -->
    <path d="M135 62 C145 42, 135 28, 135 28 C135 28, 125 42, 135 62 Z" fill="url(#goldGradEn)"/>
    <!-- Left Main Leaf (Pure White) -->
    <path d="M134 115 C106 107, 88 78, 88 78 C88 78, 118 75, 134 100 Z" fill="#ffffff"/>
    <!-- Right Main Leaf (Harvest Amber) -->
    <path d="M136 102 C164 94, 182 65, 182 65 C182 65, 152 62, 136 87 Z" fill="url(#goldGradEn)"/>
    <!-- Left Lower Leaf (Warm Cream) -->
    <path d="M134 140 C112 134, 101 112, 101 112 C101 112, 123 109, 134 129 Z" fill="#ffedd5"/>
    <!-- Right Lower Leaf (Pure White) -->
    <path d="M136 132 C158 126, 169 104, 169 104 C169 104, 147 101, 136 121 Z" fill="#ffffff"/>
  </g>

  <!-- Typography: English Primary Lockup -->
  <g transform="translate(340, 45)">
    <!-- Primary Brand Wordmark -->
    <text x="0" y="115" font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="96" font-weight="900" fill="#1c1917" letter-spacing="-2">
      Gramer <tspan fill="#ea580c">Bazar</tspan>
    </text>

    <!-- Category / Value Subtitle in Warm Terracotta -->
    <text x="4" y="180" font-family="system-ui, sans-serif" font-size="29" font-weight="800" fill="#c2410c" letter-spacing="2">
      DIRECT VILLAGE MARKETPLACE
    </text>

    <!-- Cultural Identity Tagline -->
    <text x="4" y="224" font-family="'Hind Siliguri', 'Noto Sans Bengali', system-ui, sans-serif" font-size="23" font-weight="600" fill="#78716c" letter-spacing="1">
      গ্রামের বাজার • খাঁটি পণ্য কৃষকের থেকে
    </text>
  </g>
</svg>
