<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" fill="none">
  <defs>
    <linearGradient id="appIconTerracottaGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="40%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="appIconGoldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Rounded Brand Squircle Container in Rich Terracotta -->
  <rect width="512" height="512" rx="112" fill="url(#appIconTerracottaGrad)"/>
  
  <!-- Subtle Inner Border with Warm Opacity -->
  <rect x="16" y="16" width="480" height="480" rx="96" stroke="#ffffff" stroke-opacity="0.22" stroke-width="4"/>

  <!-- Golden Ambient Harvest Sun Disc -->
  <circle cx="256" cy="180" r="110" fill="#fef3c7" fill-opacity="0.16"/>

  <!-- Stylized Village Terracotta Woven Basket / Basin (মাটির পাত্র) -->
  <path d="M140 310 C140 310, 160 410, 256 410 C352 410, 372 310, 372 310 Z" fill="#ffffff" fill-opacity="0.96"/>
  <ellipse cx="256" cy="310" rx="116" ry="24" fill="url(#appIconGoldGrad)"/>
  
  <!-- Basket Woven Artisan Accent Pattern -->
  <path d="M190 326 L230 402 M256 332 L256 410 M322 326 L282 402" stroke="#ea580c" stroke-width="6" stroke-linecap="round"/>
  <path d="M165 350 Q256 385 347 350" stroke="#ea580c" stroke-width="5" stroke-linecap="round" fill="none"/>

  <!-- Organic Central Sprout Stem (Pure Growth) -->
  <path d="M256 310 Q254 210 256 120" stroke="#ffffff" stroke-width="14" stroke-linecap="round"/>

  <!-- Top Center Sprout Leaf (Golden Harvest Crown) -->
  <path d="M256 115 C275 80, 256 50, 256 50 C256 50, 237 80, 256 115 Z" fill="url(#appIconGoldGrad)"/>

  <!-- Left Main Leaf (Pure White) -->
  <path d="M254 215 C200 200, 170 145, 170 145 C170 145, 225 140, 254 185 Z" fill="#ffffff"/>
  <!-- Left Leaf Vein -->
  <path d="M254 185 Q212 170 185 152" stroke="#ea580c" stroke-width="4" stroke-linecap="round"/>

  <!-- Right Main Leaf (Harvest Gold) -->
  <path d="M258 190 C312 175, 342 120, 342 120 C342 120, 287 115, 258 160 Z" fill="url(#appIconGoldGrad)"/>
  <!-- Right Leaf Vein -->
  <path d="M258 160 Q300 145 327 127" stroke="#b45309" stroke-width="4" stroke-linecap="round"/>

  <!-- Left Lower Sprout Leaf (Warm Peach Glow) -->
  <path d="M255 260 C215 250, 195 210, 195 210 C195 210, 235 205, 255 240 Z" fill="#ffedd5"/>

  <!-- Right Lower Sprout Leaf (Pure White) -->
  <path d="M257 245 C297 235, 317 195, 317 195 C317 195, 277 190, 257 225 Z" fill="#ffffff"/>
</svg>
